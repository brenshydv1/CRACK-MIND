<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CRACK MIND</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1020;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #151d31;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 300px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #60a5fa;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #0b1020;
            color: white;
            box-sizing: border-box; /* इनपुट बॉक्स को अंदर रखने के लिए */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #error-msg {
            color: #ef4444;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Admin Login</h2>
        <!-- यहाँ form id 'login-form' है जिसे हमने app.js में इस्तेमाल किया है -->
        <form id="login-form">
            <!-- इनपुट id 'admin-email' और 'admin-password' हैं जो app.js से जुड़े हैं -->
            <input type="email" id="admin-email" placeholder="Enter Admin Email" required>
            <input type="password" id="admin-password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="error-msg"></p>
    </div>

    <!-- app.js को लिंक करें -->
    <script src="app.js" type="module"></script>
</body>
</html>
